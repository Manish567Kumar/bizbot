version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bizbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizbot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bizbot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bizbot -d bizbot']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bizbot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    container_name: bizbot_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://bizbot:password@postgres:5432/bizbot
      REDIS_URL: redis://redis:6379
    ports:
      - '3000:3000'
    volumes:
      - ./apps/server:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
